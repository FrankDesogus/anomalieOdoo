mode: "ODOO"   # FAKE oppure ODOO

timezone: "Europe/Rome"

odoo:
  url: "https://your-instance.odoo.com"
  db: "your-db"
  user: "CHANGE_ME"
  password: "CHANGE_ME"

mail:
  enabled: true
  smtp_host: "your-smtp-host"
  smtp_port: 25
  starttls: true
  from: "sender@example.com"
  to:
    - "recipient1@example.com"
    - "recipient2@example.com"

rules:
  ingress_deadline: "09:00"
  lunch:
    enabled: true
    out_window_start: "11:30"
    out_window_end: "14:00"
    return_deadline: "14:30"
  autoclose:
    enabled: true
    time: "23:30"
    tolerance_seconds: 60
  suppress_no_checkin_if_absent_after: "14:30"

exemptions:
  limited_rules_employee_ids: []
